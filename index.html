<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>入侵</title>
<style>
body {
    margin: 0; padding: 12px; background: #000; color: #0f0;
    font-family: monospace; height: 100vh; box-sizing: border-box;
    display: flex; flex-direction: column;
}
#log {
    flex: 1; border: 1px solid #0f0; padding: 10px; margin-bottom: 10px;
    background: #001100; overflow-y: auto; font-size: 12px; line-height: 1.4;
    word-break: break-all;
}
.bar { height: 18px; border: 1px solid #0f0; margin-bottom: 10px; background: #002200; }
#fill { height: 100%; width: 0; background: #0f0; transition: width 0.1s linear; }
button {
    width: 100%; padding: 14px; background: #0f0; color: #000;
    font-weight: bold; font-size: 16px; border: none; cursor: pointer;
}
button:active { background: #0a0; }
.modal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center;
}
.card {
    border: 2px solid #f00; padding: 20px; text-align: center; background: #000;
}
.card h2 { color: #f00; margin: 0 0 10px; }
.card p { color: #f88; margin: 0 0 20px; }
.card button { background: #f00; color: #fff; border: none; padding: 10px; }
</style>
</head>
<body>

<div id="log">[READY] 等待点击...</div>
<div class="bar"><div id="fill"></div></div>
<button id="start">开始入侵</button>

<div id="modal" class="modal">
    <div class="card">
        <h2>ACCESS GRANTED</h2>
        <p>吴正航你十老风了吧</p>
        <button id="close">关闭</button>
    </div>
</div>

<script>
// 错误捕获：直接打印在屏幕上，不弹窗，防止卡死
window.onerror = function(m) {
    var logEl = document.getElementById('log');
    if(logEl) logEl.innerHTML = '<div style="color:red">[ERROR] 运行错误: ' + m + '</div>' + logEl.innerHTML;
    return true;
};

var isRunning = false;

var files = [
  '/system/etc/passwd', '/sdcard/DCIM/photo.jpg', '/data/cache/token.bin',
  '/root/.ssh/id_rsa', '/data/local/tmp/payload.dat',
  '/data/data/com.tencent.mm/MicroMsg/EnMicroMsg.db',
  '/data/misc/wifi/WifiConfigStore.xml', '/system/bin/su',
  '/var/log/auth.log', '/etc/shadow', '/data/system/accounts.db',
  '/storage/emulated/0/Download/bank.pdf', '/proc/kcore'
];

var statuses = ['OK', 'ACCESS', 'DENIED', 'ENCRYPTED', 'BYPASS', 'LOCKED'];

var logs = [
  '[OK] 握手完成', '[WARN] 检测到防火墙', '[INFO] 端口443连接',
  '[ERR] 连接超时重试', '[OK] 载荷注入成功', '[INFO] 正在提权...',
  '[OK] 获取Root权限', '[WARN] 触发反病毒引擎', '[INFO] 加密隧道已建立',
  '[OK] 截获管理员密码', '[INFO] 正在抓取屏幕画面', '[OK] 屏幕截取成功',
  '[INFO] 开启麦克风监听...', '[OK] 音频流已传输', '[INFO] 正在抹除痕迹...'
];

function getRand(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function addLog(text, isRed) {
  var logEl = document.getElementById('log');
  var div = document.createElement('div');
  div.textContent = text; // 使用 textContent 性能更好且防XSS
  div.style.color = isRed ? '#f00' : '#0f0';
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight; 
  
  // 性能优化：使用 while 确保清理多余节点
  while (logEl.children.length > 120) {
    logEl.removeChild(logEl.firstChild);
  }
}

function getHash() {
  var chars = '0123456789ABCDEF';
  var res = '0x';
  for(var i=0; i<4; i++) res += chars[Math.floor(Math.random()*16)];
  return res;
}

function doHack() {
  if (isRunning) return;
  isRunning = true;

  document.getElementById('modal').style.display = 'none';
  document.getElementById('log').innerHTML = '';
  document.getElementById('fill').style.width = '0%';
  
  var btn = document.getElementById('start');
  btn.disabled = true;
  btn.innerText = '正在执行...';

  var progress = 0;
  
  // 间隔调回安全的 80 毫秒，防止手机浏览器崩溃
  var timer = setInterval(function() {
    progress += Math.random() * 3 + 1.5; 
    if (progress > 100) progress = 100;
    
    document.getElementById('fill').style.width = progress + '%';

    // 必出扫描日志
    var status = getRand(statuses);
    var isRed = (status === 'DENIED' || status === 'LOCKED');
    addLog('[SCAN] ' + getRand(files) + ' ... ' + status + ' [' + getHash() + ']', isRed);

    // 60%概率出系统日志
    if (Math.random() < 0.6) {
      var logText = getRand(logs);
      var isErr = (logText.indexOf('ERR') !== -1 || logText.indexOf('WARN') !== -1);
      addLog(logText, isErr);
    }

    if (progress >= 100) {
      clearInterval(timer);
      addLog('[DONE] 数据窃取完毕', true);
      
      setTimeout(function() {
        document.getElementById('modal').style.display = 'flex';
        btn.disabled = false;
        btn.innerText = '重新入侵';
        isRunning = false;
      }, 800);
    }
  }, 80); 
}

document.getElementById('start').onclick = doHack;
document.getElementById('close').onclick = function() {
    document.getElementById('modal').style.display = 'none';
};
</script>
</body>
</html>
