<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>张景全防</title>
<style>
  /* 基础设置 */
  body {
    margin: 0; padding: 0;
    background-color: #000;
    color: #0f0;
    font-family: monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 代码雨背景 */
  #matrix {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }

  /* 顶栏 */
  .header {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #050;
    background: rgba(0, 20, 0, 0.5);
    position: relative;
    z-index: 10;
  }
  .header h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #0f0;
  }
  .header p {
    margin: 5px 0 0 0;
    font-size: 12px;
    color: #8f8;
  }

  /* 日志区 */
  .log-box {
    flex: 1;
    margin: 10px 20px 100px 20px; /* 底部留出空间给 controls */
    padding: 10px;
    border: 1px solid rgba(0, 255, 0, 0.3);
    background: rgba(0, 15, 0, 0.7);
    font-size: 12px;
    line-height: 1.5;
    overflow-y: auto;
    position: relative;
    z-index: 10;
    word-break: break-all; /* 防止长路径撑破屏幕 */
  }

  /* 控制区 (绝对定位到底部) */
  .controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 20px;
    background: rgba(0, 0, 0, 0.9);
    z-index: 999;
    border-top: 1px solid #050;
  }

  /* 进度条 */
  .progress-bar {
    height: 15px;
    border: 1px solid #0f0;
    border-radius: 10px;
    margin-bottom: 15px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #063, #0f0);
    box-shadow: 0 0 10px #0f0;
    transition: width 0.1s;
  }

  /* 按钮 */
  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    background-color: rgba(0, 255, 0, 0.1);
    color: #0f0;
    border: 1px solid #0f0;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
    text-align: center;
    outline: none;
  }
  .btn:active {
    background-color: rgba(0, 255, 0, 0.3);
  }

  /* 伪装系统弹窗 */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-content {
    background: #fff;
    color: #000;
    padding: 20px;
    border-radius: 10px;
    width: 80%;
    max-width: 300px;
    font-family: sans-serif;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .modal-content h3 { margin: 0 0 10px; font-size: 18px; }
  .modal-content p { margin: 0 0 20px; font-size: 14px; color: #333; line-height: 1.5; }
  .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
  .modal-btns button {
    padding: 8px 15px;
    border: none;
    background: none;
    font-size: 16px;
    font-weight: bold;
  }
  .btn-deny { color: #ff3b30; }
  .btn-allow { color: #007aff; }
</style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="header">
    <h1>张景全防</h1>
    <p>SYSTEM BREACH SIMULATOR</p>
  </div>

  <div class="log-box" id="log">
    [READY] 系统就绪，等待指令...
  </div>

  <div class="controls">
    <div class="progress-bar">
      <div class="progress-fill" id="fill"></div>
    </div>
    <button class="btn" id="startBtn" onclick="showP()">开始入侵</button>
  </div>

  <!-- 伪装权限弹窗 -->
  <div class="modal" id="sysModal">
    <div class="modal-content">
      <h3>权限请求</h3>
      <p>“张景全防”想要访问设备上的所有文件，包括照片、媒体和文档。</p>
      <div class="modal-btns">
        <button class="btn-deny" onclick="hideP()">拒绝</button>
        <button class="btn-allow" onclick="startHack()">允许</button>
      </div>
    </div>
  </div>

  <!-- 成功弹窗 -->
  <div class="modal" id="successModal">
    <div class="modal-content" style="background:#001a00; color:#0f0; border:1px solid #0f0;">
      <h3>ACCESS GRANTED</h3>
      <p style="color:#9f9; font-weight:bold;">入侵完成<br>无正好你十老风了吧</p>
      <div class="modal-btns">
        <button class="btn-allow" style="color:#0f0;" onclick="hideSuccess()">关闭</button>
      </div>
    </div>
  </div>

<script>
  /* ================= 逻辑控制部分 ================= */
  var hackTimer = null;

  function showP() {
    document.getElementById('sysModal').style.display = 'flex';
  }

  function hideP() {
    document.getElementById('sysModal').style.display = 'none';
  }

  function hideSuccess() {
    document.getElementById('successModal').style.display = 'none';
    document.getElementById('startBtn').innerText = '重新入侵';
  }

  function startHack() {
    hideP();
    var logEl = document.getElementById('log');
    var fill = document.getElementById('fill');
    var btn = document.getElementById('startBtn');
    
    // 清空历史日志
    logEl.innerHTML = '';
    
    // 安全添加日志的方法
    function addLog(text, color) {
      var div = document.createElement('div');
      div.innerText = text;
      if (color) div.style.color = color;
